# Blueprint สำหรับ deploy backend ขึ้น Render (https://render.com)
#
# วิธีใช้: Render Dashboard > New > Blueprint > เลือก repo นี้
# Render จะอ่านไฟล์นี้แล้วสร้าง service ให้เอง ไม่ต้องกรอก build/start command เอง
#
# ⚠️ env var ที่ sync: false ต้องไปกรอกค่าเองในหน้า dashboard ของ Render
#    (ห้าม commit ค่าจริงลงไฟล์นี้ เพราะไฟล์นี้อยู่ใน git)
services:
  - type: web
    name: ecoquest-api
    runtime: node
    plan: free
    # โค้ด backend อยู่ในโฟลเดอร์ย่อย ไม่ได้อยู่ root ของ repo (root เป็นโปรเจค Flutter)
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # Render ยิงเช็คที่ path นี้เพื่อดูว่า service ยังไหวอยู่ไหม
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Render บล็อก SMTP — ถ้าตั้งค่านี้ OTP จะส่งผ่าน Brevo API แทน (GMAIL_USER ต้องเป็น sender ที่ verify ใน Brevo)
      - key: BREVO_API_KEY
        sync: false
      # อีเมลแอดมิน คั่นด้วย comma, ไม่ตั้ง = ปิดเครื่องมือแอดมิน
      - key: ADMIN_EMAILS
        sync: false
      # Push notification (FCM) — เนื้อหาไฟล์ service account JSON ของ Firebase ทั้งก้อน ดู backend/utils/push.js
      # ไม่ตั้ง = ไม่มี push (แจ้งเตือนในแอพยังใช้ได้)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
